function textbookChapter(s, i){
 const topic=DB.subjects[s][i], terms=DB.concepts[s]||[];
 const relevant=terms.slice((i*3)%Math.max(1,terms.length), (i*3)%Math.max(1,terms.length)+7);
 const termList=(relevant.length?relevant:terms.slice(0,7)).map(x=>`<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join("");
 const desc=esc(topic[1]);
 const discipline={
  "Use of English":{method:"Read the passage twice: first for the overall message, then for the exact evidence. For grammar, identify the subject, main verb, tense and relationship between clauses before choosing an option.",example:"Sentence: ‘Neither the teacher nor the students ___ ready.’ With neither…nor, the verb agrees with the nearer subject. ‘Students’ is plural, so the correct form is ‘were’. Check the sentence by replacing the compound subject with its nearer noun.",tasks:["Identify the main idea and two supporting details in a short passage.","Correct five sentences containing concord or tense errors.","Explain the meaning of three words from context."]},
  "Mathematics":{method:"Write the information given, state the rule or formula, substitute values carefully, show each line of working, include units where needed, and check the answer by reversing the operation.",example:"Solve 3(2x − 1) = 15. Expand: 6x − 3 = 15. Add 3: 6x = 18. Divide by 6: x = 3. Check: 3(6 − 1) = 15, so the answer is correct.",tasks:["Create one worked example using the rule in this chapter.","Solve a similar problem with different values and show every step.","Explain one common error and how to check your answer."]},
  "Biology":{method:"Study biological structures together with their functions. For every process, learn the starting materials, sequence of events, products and conditions required. Use labelled diagrams and compare related structures.",example:"A plant cell has a cell wall, cell membrane, cytoplasm, nucleus and usually a large permanent vacuole. The cell wall gives support; the membrane controls movement in and out; the nucleus contains genetic material; the vacuole helps maintain turgidity. A chloroplast is present in photosynthetic cells and contains chlorophyll.",tasks:["Draw and label a relevant biological structure.","Describe a process in the correct sequence.","Compare two related structures or organisms in a table."]},
  "Chemistry":{method:"Balance chemical equations before doing calculations. Write the known quantities with units, convert to moles when required, use the balanced equation's mole ratio, then convert to the requested unit.",example:"For 2H₂ + O₂ → 2H₂O, 2 moles of hydrogen react with 1 mole of oxygen to form 2 moles of water. If 4 mol H₂ reacts with excess oxygen, water formed = 4 mol because the H₂:H₂O ratio is 2:2. With Mᵣ(H₂O)=18, mass = 4 × 18 = 72 g.",tasks:["Write and balance an equation related to the topic.","Identify the particles, conditions or observations involved.","Complete a calculation showing formula, substitution and units."]},
  "Physics":{method:"List known values and the unknown quantity. Convert all values to SI units, choose an equation that connects them, rearrange before substitution, calculate, and state the correct unit and direction where relevant.",example:"A car changes velocity from 5 m/s to 25 m/s in 4 s. Acceleration a = (v − u)/t = (25 − 5)/4 = 20/4 = 5 m/s². The positive result means acceleration is in the chosen positive direction.",tasks:["State the relevant physical law and define its symbols.","Solve a numerical problem with SI units.","Describe an experiment that could test the relationship."]},
  "Economics":{method:"Define the economic concept precisely, identify the scarce resources and choices involved, then explain the cause-and-effect chain. Use a labelled diagram where a curve or market relationship is relevant.",example:"If demand rises while supply stays unchanged, the demand curve shifts right. At the old price, quantity demanded exceeds quantity supplied. Competitive pressure tends to raise price; movement along the supply curve increases quantity supplied until a new equilibrium is reached.",tasks:["Define the concept and give a Nigerian example.","Explain two causes and two effects.","Draw and label a diagram or table where appropriate."]},
  "Government":{method:"Separate institutions, powers and processes. For each institution, learn its composition, functions, limits, relationship with other institutions and one practical example. Distinguish constitutional rules from political practice.",example:"Under separation of powers, law-making is assigned primarily to the legislature, execution of laws to the executive, and interpretation of laws to the judiciary. Checks and balances allow each arm to limit abuses by another; independence does not mean that the arms never interact.",tasks:["List the functions of the relevant institution.","Compare two systems or constitutional principles.","Explain one advantage, one limitation and an example."]},
  "Literature in English":{method:"Support every interpretation with evidence from the text. Analyse who speaks, what happens, the setting, conflict, imagery, tone and structure. Distinguish the author from the narrator and a character from the actor who portrays one.",example:"If a storm appears immediately before a character's crisis, it may function as pathetic fallacy or symbolism. Do not assume this automatically: explain how the weather mirrors the character's mood and cite the surrounding events as evidence.",tasks:["Describe a character using two actions or quotations from your set text.","Identify a theme and explain how it develops.","Analyse one image, symbol or dramatic technique and its effect."]},
  "Christian Religious Studies":{method:"Read the passage in context: identify the people, setting, problem, action and outcome. Then state the teaching and distinguish what the passage explicitly says from a modern application.",example:"In the parable of the Good Samaritan (Luke 10:25–37), the Samaritan helps an injured stranger when others pass by. The lesson concerns practical compassion across social boundaries; neighbourliness is shown through action, not merely group identity.",tasks:["Summarise a relevant Bible passage accurately.","State two lessons and support each from the text.","Apply one lesson to a realistic community situation."]},
  "Commerce":{method:"For each commercial activity, identify the parties, goods or services, documents, risks and flow of money or information. Distinguish similar terms by their purpose and who bears responsibility.",example:"A wholesaler buys goods in bulk from a producer and resells smaller quantities to retailers. The wholesaler performs storage, bulk-breaking and distribution functions, but generally does not sell primarily to final household consumers.",tasks:["Define the commercial term and identify its users.","Trace a product's route from producer to consumer.","Compare two forms of trade or business ownership."]},
  "Computer Studies":{method:"Learn the relationship between hardware, software, data, users and procedures. Trace input → processing → output → storage. For practical questions, identify the task, choose the correct tool and explain the steps and expected result.",example:"To calculate a spreadsheet total for cells B2 to B6, enter =SUM(B2:B6) in the result cell and press Enter. The colon denotes the continuous range. If a value in the range changes, the formula recalculates automatically.",tasks:["Draw and label the relevant system or network.","Write the steps for a practical computer task.","Identify a security risk and a suitable preventive measure."]},
  "French":{method:"Read the whole sentence before selecting a tense or pronoun. Identify the subject, gender, number, time expression and verb infinitive. Learn vocabulary in phrases rather than as isolated translations.",example:"Je parle français = I speak French. With ‘nous’, the regular -er verb parler becomes ‘nous parlons’. For a simple negative, place ne before the conjugated verb and pas after it: ‘Je ne parle pas’.",tasks:["Conjugate a regular verb with three subject pronouns.","Translate a short everyday dialogue in context.","Write five sentences using the vocabulary of the topic."]},
  "Geography":{method:"Use location, scale, direction and evidence. When interpreting a map, read the title, key, scale and orientation first. For processes, explain the sequence and show how physical and human factors interact.",example:"A map scale of 1:50,000 means 1 cm on the map represents 50,000 cm on the ground, which is 500 m. A measured map distance of 4 cm therefore represents 4 × 500 m = 2,000 m = 2 km.",tasks:["Interpret a map, graph or climate table.","Explain a physical or human process in stages.","Give one local example and discuss its effects."]},
  "History":{method:"Organise events chronologically and examine causes, triggers, key actors, consequences and continuity. Distinguish primary evidence from later interpretation and avoid explaining complex events with only one cause.",example:"When analysing a historical reform, separate long-term causes (such as economic pressure), immediate triggers (a particular decision), the actors involved and short- and long-term consequences. Then assess which factor had the greatest influence and justify the judgement with evidence.",tasks:["Create a timeline of key events.","Explain two causes and two consequences.","Assess the importance of one individual or institution using evidence."]},
  "Agricultural Science":{method:"Connect farm practices to soil, climate, plant or animal needs, labour, capital and markets. For every practice, know its purpose, correct sequence, tools, timing and likely consequences of poor management.",example:"Crop rotation means growing different crop types on the same land in a planned sequence. Including a legume can improve soil nitrogen through nitrogen-fixing bacteria in root nodules. Rotation can also interrupt pest and disease cycles, although the crops must be selected for the local soil and climate.",tasks:["Describe a farm operation in the correct order.","Identify inputs, outputs and factors affecting yield.","Explain one sustainable practice and its benefit."]},
  "Principles of Accounts":{method:"Identify the transaction, affected accounts and whether each account is debited or credited. Apply the double-entry rule: every transaction has equal debit and credit entries. Keep calculations in a clear column format.",example:"A business buys equipment for ₦50,000 cash. Debit Equipment ₦50,000 because an asset increases; credit Cash ₦50,000 because an asset decreases. Total debits = total credits = ₦50,000. The transaction does not create an expense immediately; equipment is a non-current asset.",tasks:["Analyse three transactions into debit and credit entries.","Prepare a simple ledger or statement from given balances.","Explain why the trial balance may not reveal every error."]},
  "Islamic Religious Studies":{method:"Study the relevant Qur'anic passage, Hadith or historical account with its context. Identify the teaching, evidence, practical implication and any distinction between a primary source and a later explanation.",example:"Zakat is an obligatory form of almsgiving for eligible Muslims who meet the relevant conditions. It is distinct from voluntary sadaqah. In an exam response, explain its social purpose—supporting eligible recipients and strengthening responsibility—without confusing it with every charitable donation.",tasks:["Summarise the source passage or event accurately.","State two teachings and explain their application.","Compare a required act with a voluntary act where relevant."]},
  "Home Economics":{method:"Relate household decisions to nutrition, health, safety, resources, family needs and budgeting. For practical procedures, list materials, preparation, steps, hygiene precautions and evaluation criteria.",example:"A balanced meal should provide appropriate amounts of energy-giving foods, body-building foods and protective foods. A meal of rice, beans and vegetables combines carbohydrate, plant protein, fibre and micronutrients. Portion size and individual needs still matter.",tasks:["Plan a practical household task step by step.","Explain how a choice affects health, cost and safety.","Prepare a simple budget or meal plan and justify it."]},
  "Music":{method:"Listen for the musical element being tested: pitch, rhythm, tempo, dynamics, texture, timbre or form. Read notation from clef and key signature, count beats carefully and distinguish a note's pitch from its duration.",example:"In 4/4 time, a bar contains four quarter-note beats. A minim lasts two quarter-note beats, so two minims fill one bar. Count ‘1-2-3-4’ evenly and check that the note values add up to four beats.",tasks:["Identify the elements heard or shown in a score.","Clap or write a short rhythm and count its beats.","Compare two instruments by tone colour and playing method."]},
  "Art (Fine Art)":{method:"Analyse artwork through subject matter, elements, principles, materials, technique, context and intended meaning. In practical work, plan composition first, select suitable materials, build forms carefully and evaluate the final result.",example:"In a balanced composition, visual weight can be distributed symmetrically or asymmetrically. A large dark shape may balance several smaller light shapes. Balance does not require identical objects; it requires an intentional distribution of visual emphasis.",tasks:["Identify elements and principles in an artwork.","Describe a material and explain a suitable technique.","Analyse how composition supports meaning."]},
  "Arabic":{method:"Identify the root, pattern, grammatical role and sentence context. Pay attention to gender, number, case endings and agreement. Translate meaning from the full sentence rather than matching each word mechanically.",example:"In a simple nominal sentence such as ‘الطالبُ مجتهدٌ’ (The student is hardworking), the sentence begins with a noun. The first noun is the subject/topic (مبتدأ) and the descriptive predicate is خبر; both are nominative in this basic construction.",tasks:["Identify the grammatical role of words in a short sentence.","Translate a short passage accurately.","Write sentences using the vocabulary and structure studied."]},
  "Hausa":{method:"Study vocabulary, spelling, sentence order, grammar and oral expression in context. Notice tone and sound distinctions where relevant, and practise reading a complete passage before answering comprehension questions.",example:"For a comprehension answer, locate the sentence that contains the evidence, restate it in clear Hausa and ensure the response answers the question asked. Do not add information that the passage does not support.",tasks:["Write a short paragraph on a familiar topic.","Identify vocabulary and grammatical features in a passage.","Answer comprehension questions with evidence from the text."]},
  "Igbo":{method:"Learn vocabulary and sentence patterns in context, paying attention to tone marks, spelling and idiomatic meaning. For oral forms, practise the sounds accurately; for comprehension, support answers with details from the passage.",example:"When reading an Igbo sentence, do not ignore tone marks where they are provided: tone can distinguish meanings. Read the full phrase, identify its grammatical role and use the surrounding context to confirm the intended sense.",tasks:["Compose a short passage using the target vocabulary.","Explain the meaning of an expression in context.","Answer comprehension questions using details from the text."]},
  "Yoruba":{method:"Study vocabulary and grammar with correct tone marks. Practise listening and speaking as well as reading. In comprehension, identify the central idea and support each answer with information from the passage.",example:"Yoruba is a tonal language: high, mid and low tones can distinguish words that otherwise share similar consonants and vowels. Tone marks therefore carry meaning and should not be treated as decoration when reading or writing.",tasks:["Write a short paragraph with correct tone marks.","Explain an idiom or proverb in context.","Answer comprehension questions with evidence."]},
  "Physical and Health Education":{method:"Relate each activity to fitness components, body systems, rules, skills, safety and fair play. For health topics, distinguish prevention, symptoms, transmission and appropriate help-seeking; avoid unsafe self-treatment.",example:"A warm-up gradually raises heart rate and muscle temperature before vigorous activity. A useful warm-up includes light aerobic movement followed by controlled dynamic movements related to the sport. It should prepare the body, not exhaust it.",tasks:["Describe a skill or rule and demonstrate its sequence.","Explain how an activity develops a fitness component.","State safety precautions and the purpose of each."]}
 };
 const plan=discipline[s]||discipline["Use of English"];
 const vocab=termList||"<li>Identify the central terms and explain each in your own words.</li>";
 return `<section class="bookchapter"><h2>Chapter ${i+1}: ${esc(topic[0])}</h2>
 <h3>1. Learning outcomes</h3><p>By the end of this chapter, you should be able to explain the main ideas, use the correct subject vocabulary, interpret examples, apply the principles to unfamiliar questions and identify common misconceptions.</p>
 <h3>2. Chapter overview</h3><p>${desc}</p><p>This unit is best understood by connecting its individual parts. Start with the meaning of each term, then study the relationship between the terms, and finally apply the ideas to a practical or examination situation. Do not memorise a list without understanding what each item does and why it matters.</p>
 <h3>3. Core teaching notes</h3><p><b>Understand the central idea.</b> Write a one-sentence definition of the main concept. A good definition states what the concept is and distinguishes it from related concepts. Add an example and, where useful, a non-example.</p><p><b>Break the topic into parts.</b> Use the key terms below as a vocabulary map. For each term, learn its meaning, features, role and relationship to the other parts of the topic. If the topic describes a process, arrange the stages in order and explain what changes at each stage. If it describes categories, state the basis of classification and give an example of each category.</p><p><b>Apply the idea.</b> Connect the topic to a familiar Nigerian or everyday context where appropriate. Ask: what causes the situation, what principle explains it, what evidence would support the explanation, and what result should follow?</p>
 <h3>4. Key terms and concepts</h3><ul>${vocab}</ul>
 <h3>5. Step-by-step study method</h3><ol><li>Read the topic description and underline unfamiliar terms.</li><li>Define each term in your own words, then compare your definition with the notes.</li><li>Draw a labelled diagram, flow chart, timeline, table or equation where it helps explain the idea.</li><li>Work through the example below without skipping the reasoning.</li><li>Close the notes and explain the topic aloud, then attempt the exercises.</li></ol>
 <h3>6. Worked example / application</h3><div class="bookcallout"><b>Worked example:</b><p>${plan.example}</p><b>Why this approach works:</b> It identifies the principle first, applies it in a logical sequence and checks that the conclusion follows from the evidence or calculation.</div>
 <h3>7. How to answer JAMB questions on this topic</h3><p>${plan.method}</p><ol><li>Read the command word: define, identify, calculate, compare, explain, infer or select.</li><li>Identify the precise part of the syllabus being tested.</li><li>Recall the rule or evidence—not just a familiar keyword.</li><li>Test each option against the rule and remove distractors that are incomplete or inaccurate.</li><li>After answering, explain why the correct option is right and why one tempting alternative is wrong.</li></ol>
 <h3>8. Common mistakes to avoid</h3><ul><li>Memorising a definition but being unable to apply it to a new example.</li><li>Confusing two related terms because their names look similar.</li><li>Ignoring units, labels, dates, context, grammar or the wording of the question.</li><li>Choosing an option because it contains a familiar word rather than because the whole statement is correct.</li></ul>
 <h3>9. Chapter exercises</h3><ol>${plan.tasks.map(x=>`<li>${esc(x)}</li>`).join("")}<li>Write five original objective questions from this chapter and provide the correct answers with explanations.</li><li>Summarise the chapter in 100–150 words without copying the notes.</li></ol>
 <h3>10. Revision checklist</h3><ul><li>I can define the key terms accurately.</li><li>I can explain the main process, relationship or argument in the correct order.</li><li>I can work through the example without looking at the solution.</li><li>I can apply the idea to a new situation and justify my answer.</li><li>I have checked this topic against the current official JAMB IBASS syllabus.</li></ul>
 </section>`;
}
function makeTextbookHTML(s){
 const chapters=DB.subjects[s].map((_,i)=>textbookChapter(s,i)).join("");
 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(s)} — JAMB MASTER X Textbook</title><style>body{font:16px/1.75 Georgia,serif;max-width:850px;margin:30px auto;padding:0 18px;color:#182235}h1,h2,h3{font-family:Arial,sans-serif;line-height:1.3}h1{font-size:32px}h2{color:#1746a2;border-top:1px solid #ddd;padding-top:20px}h3{margin-bottom:4px}p{margin-top:6px}.box{background:#eef3ff;padding:12px;border-left:4px solid #1746a2}li{margin:5px 0}.chapter{page-break-before:always}a{color:#1746a2}@media print{body{max-width:none;margin:0}.chapter{break-before:page}}</style></head><body><h1>JAMB MASTER X</h1><h2>${esc(s)} — Syllabus Learning Textbook</h2><p><b>Learning edition · Offline HTML</b></p><div class="box"><b>Important:</b> This is an original expanded learning edition generated for JAMB MASTER X. It is not an official JAMB publication and cannot guarantee exhaustive coverage of every current syllabus objective. Confirm the current syllabus at JAMB IBASS and consult prescribed texts for further depth. Confirm all examinable objectives through <a href="https://ibass.jamb.gov.ng/">JAMB IBASS</a>.</div><h2>How to study</h2><p>Study one chapter at a time. Work through the applied example, complete the chapter exercises, make your own notes and revisit weak areas. Use the current official JAMB IBASS syllabus as the final checklist.</p><h2>Table of contents</h2><ol>${DB.subjects[s].map(t=>`<li>${esc(t[0])}</li>`).join("")}</ol>${chapters}<hr><p>JAMB MASTER X · Personal study copy · Verify the current syllabus at ibass.jamb.gov.ng</p></body></html>`;
}
function openTextbook(s){
 selectedSubject=s;
 document.querySelector("#app").innerHTML=`${header("DIGITAL TEXTBOOK",esc(s), "Read the chapters in order. Use Print / Save as PDF in Chrome to keep an offline PDF copy.", `<button class="btn alt" id="downloadCurrentBook">Download HTML</button> <button class="btn line" id="printCurrentBook">Print / Save PDF</button> <button class="btn line" id="backBooks">Back to library</button>`)}<div class="card lessonbody"><div class="bookcallout"><b>Study note:</b> This is a syllabus-organised learning guide. Use the official IBASS syllabus and a full subject textbook to confirm and deepen every examinable objective.</div><h2>Table of contents</h2><ol>${DB.subjects[s].map((t,i)=>`<li><a href="#chapter${i}">${esc(t[0])}</a></li>`).join("")}</ol>${DB.subjects[s].map((t,i)=>textbookChapter(s,i).replace('<section class="bookchapter">',`<section class="bookchapter" id="chapter${i}">`)).join("")}</div>`;
 document.querySelector("#downloadCurrentBook").onclick=()=>downloadBook(s);
 document.querySelector("#printCurrentBook").onclick=()=>window.print();
 document.querySelector("#backBooks").onclick=()=>go("books");
 window.scrollTo(0,0);
}
function downloadBook(s){
 const blob=new Blob([makeTextbookHTML(s)],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=`JAMB_MASTER_X_${s.replace(/[^a-z0-9]+/gi,"_")}_TEXTBOOK.html`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
 toast("Textbook download started");
}

function practicePage(){return `${header("QUESTION PRACTICE","Past-question practice centre","Choose a subject and practise objective questions. This build contains original JAMB-style practice items, not a verbatim archive of copyrighted historical JAMB papers.")}<div class="card"><h3>Choose subject</h3><select class="field" id="practiceSubject">${subjects.map(s=>`<option>${esc(s)}</option>`).join("")}</select><div class="toolbar"><label>Number of questions <select class="field" id="count"><option>10</option><option>20</option><option>40</option><option>60</option><option>100</option></select></label><label>Mode <select class="field" id="mode"><option value="study">Practice with explanations</option><option value="exam">Timed test</option></select></label><label>Time <select class="field" id="minutes"><option value="20">20 minutes</option><option value="40">40 minutes</option><option value="60">60 minutes</option><option value="120">120 minutes</option></select></label></div><button class="btn" id="startPractice">Start questions →</button></div><div class="card"><h3>Historical past-question resources</h3><p class="muted">For actual historical papers, use authorised books or licensed providers. We do not reproduce copyrighted JAMB papers here. You can import question sets you have permission to use in a future content update.</p><p><a href="https://ibass.jamb.gov.ng/" target="_blank" rel="noopener">Open JAMB IBASS official syllabus portal ↗</a></p></div>${ad()}`}
function assignmentsPage(){return `${header("REVISION TASKS","Topic assignments","Choose a subject and complete a short test based on its syllabus concepts.")}<div class="grid subjects">${subjects.map(s=>`<button class="subject" data-assignment="${esc(s)}">📝<b>${esc(s)}</b><small>10-question revision assignment</small></button>`).join("")}</div>`}
function resultsPage(){return `${header("YOUR PROGRESS","Results and performance","All results are stored in this browser on this device.")}<div class="card">${state.history.slice().reverse().map(r=>`<div class="row topic"><div><b>${esc(r.title)}</b><div class="muted">${new Date(r.date).toLocaleString()} · ${r.correct}/${r.total} correct</div></div><span class="pill">${r.pct}%</span></div>`).join("")||"<p class='muted'>No completed tests yet.</p>"}</div>`}
function savedPage(){let qs=allQuestions().filter(q=>state.bookmarks.includes(q.id));return `${header("REVISION LIST","Saved questions","Questions saved during practice.")}<div class="card">${qs.map(q=>`<div class="topic"><b>${esc(q.subject)}</b><p>${esc(q.q)}</p><small>${esc(q.topic)}</small></div>`).join("")||"<p class='muted'>You have not saved any questions yet.</p>"}</div>`}
function settingsPage(){return `${header("DEVICE STORAGE","Backup and settings","Your learning progress is local to this browser. Export a backup before clearing browser data or changing devices.")}<div class="card"><button class="btn" id="export">Export progress backup</button> <label class="btn alt" for="import">Import backup</label><input type="file" id="import" accept="application/json" hidden><p style="margin-top:18px"><button class="btn red" id="clear">Clear local progress</button></p><p class="smallnote">This single-file version has no backend, user accounts or cloud synchronisation. Ads are supplied by Adsterra; third-party advertising partners may use cookies or similar technologies subject to their own policies. Add a full privacy policy and cookie notice appropriate to your deployment before publishing.</p></div>`}
function allQuestions(){return subjects.flatMap(s=>makeQs(s))}
function makeQs(s){let c=DB.concepts[s];let topics=DB.subjects[s];let out=[];for(let n=0;n<100;n++){let x=c[n%c.length],t=topics[Math.floor(n/Math.max(1,Math.ceil(100/topics.length)))%topics.length];let distract=c.filter((v,i)=>i!==n%c.length).map(v=>v[1]);let correct=x[1],opts=[correct,distract[(n+1)%distract.length],distract[(n+3)%distract.length],distract[(n+5)%distract.length]];let shift=(n*7+subjects.indexOf(s))%4;opts=opts.slice(shift).concat(opts.slice(0,shift));out.push({id:s+"_"+n,subject:s,topic:t[0],q:`Which option best describes "${x[0]}"?`,o:opts,a:opts.indexOf(correct),e:`${x[0]} means ${correct}. Review the syllabus topic "${t[0]}" and your textbook notes for more examples.`})}return out}
let qbank={};subjects.forEach(s=>qbank[s]=makeQs(s));
function startQuiz(s,n,mode,minutes){clearInterval(clock);let items=qbank[s].slice(0,n).sort(()=>Math.random()-.5);quiz={s,items,title:s+" "+(mode==="assignment"?"assignment":mode==="exam"?"timed practice":"practice"),mode,idx:0,answers:{},remaining:mode==="exam"?minutes*60:null};showQuiz();if(quiz.remaining!==null)clock=setInterval(()=>{if(!quiz)return;quiz.remaining--;let el=document.querySelector("#timer");if(el)el.textContent=fmt(quiz.remaining);if(quiz.remaining<=0)finishQuiz(true)},1000)}
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function showQuiz(){let q=quiz.items[quiz.idx],sel=quiz.answers[q.id];document.querySelector("#app").innerHTML=`${header(quiz.mode==="exam"?"TIMED PRACTICE":"LEARNING PRACTICE",esc(quiz.title),`Question ${quiz.idx+1} of ${quiz.items.length}`,`<span class="pill" id="timer">${quiz.remaining===null?"SELF-PACED":fmt(quiz.remaining)}</span>`)}<div class="qbox"><div class="card"><div class="row"><span class="pill">${esc(q.subject)} · ${esc(q.topic)}</span><span class="muted">${sel===undefined?"Not answered":"Answer selected"}</span></div><div class="progress"><span style="width:${(quiz.idx+1)/quiz.items.length*100}%"></span></div><div class="qtext">${quiz.idx+1}. ${esc(q.q)}</div>${q.o.map((o,i)=>`<label class="option ${sel===i?"selected":""}"><input type="radio" name="ans" value="${i}" ${sel===i?"checked":""}> <b>${"ABCD"[i]}.</b> ${esc(o)}</label>`).join("")}<div class="toolbar"><button class="btn line" id="prev" ${quiz.idx===0?"disabled":""}>← Previous</button><button class="btn alt" id="bookmark">☆ Save</button><button class="btn" id="next">${quiz.idx===quiz.items.length-1?"Submit / finish":"Next →"}</button></div></div><div class="card"><b>Question navigator</b><div class="qnav">${quiz.items.map((x,i)=>`<button class="qnum ${i===quiz.idx?"current":""} ${quiz.answers[x.id]!==undefined?"done":""}" data-jump="${i}">${i+1}</button>`).join("")}</div><button class="btn red" id="submit">Submit test</button></div></div>`;document.querySelectorAll('input[name="ans"]').forEach(el=>el.onchange=()=>{quiz.answers[q.id]=+el.value;showQuiz()});document.querySelector("#prev").onclick=()=>{quiz.idx--;showQuiz()};document.querySelector("#next").onclick=()=>{if(quiz.idx<quiz.items.length-1){quiz.idx++;showQuiz()}else finishQuiz(false)};document.querySelector("#submit").onclick=()=>finishQuiz(false);document.querySelector("#bookmark").onclick=()=>{if(!state.bookmarks.includes(q.id))state.bookmarks.push(q.id);save();toast("Saved for revision")};document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{quiz.idx=+b.dataset.jump;showQuiz()});nav()}
function finishQuiz(auto){clearInterval(clock);let correct=quiz.items.filter(q=>quiz.answers[q.id]===q.a).length,rec={title:quiz.title,total:quiz.items.length,correct,pct:Math.round(correct/quiz.items.length*100),date:new Date().toISOString()};state.history.push(rec);save();let details=quiz.items.map((q,i)=>`<div class="topic"><b>${i+1}. ${esc(q.q)}</b><p class="muted">${quiz.answers[q.id]===q.a?"Correct":"Not correct"} · Correct answer: ${"ABCD"[q.a]}. ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>`).join("");quiz=null;document.querySelector("#app").innerHTML=`${header("TEST REPORT",auto?"Time is up":"Practice completed","Review the correct answers and explanations below.")}<div class="card qbox"><div class="stat" style="font-size:46px;color:var(--blue)">${rec.pct}%</div><h2>${rec.correct} / ${rec.total} correct</h2><p class="muted">Your score has been saved on this device.</p><button class="btn" id="home">Dashboard</button> <button class="btn alt" id="again">Practise again</button></div><div class="card qbox"><h2>Answer explanations</h2>${details}</div>`;document.querySelector("#home").onclick=()=>go("home");document.querySelector("#again").onclick=()=>go("practice");nav()}
function showSponsoredBreak(subject, proceed){
 const old=document.getElementById("sponsorBreak"); if(old) old.remove();

 document.body.insertAdjacentHTML("beforeend",`<div class="sponsor-backdrop" id="sponsorBreak" role="dialog" aria-modal="true" aria-labelledby="sponsorTitle"><section class="sponsor-dialog"><div class="row"><span class="sponsor-label">SPONSORED BREAK</span><span class="pill">Adsterra enabled</span></div><h2 id="sponsorTitle">Continue to ${safe}</h2><p class="muted">This learning site may display advertisements to support free study resources. You can continue without clicking an advertisement.</p><div class="sponsor-slot"><div><b>Advertisement area</b><br><small>Adsterra placements load according to the ad network and browser settings. An ad is not guaranteed to appear on every visit.</small></div></div><div class="sponsor-actions"><button class="btn line" id="sponsorClose">Continue to subject</button><button class="btn" id="sponsorContinue">Open ${safe}</button></div><p class="smallnote">Please never click an ad just to support the website. Only interact with an advertisement if it genuinely interests you.</p></section></div>`);
 const finish=()=>{const el=document.getElementById("sponsorBreak");if(el)el.remove();if(typeof proceed==="function")proceed()};
 document.getElementById("sponsorClose").onclick=finish;
 document.getElementById("sponsorContinue").onclick=finish;
}
function bind(){document.querySelectorAll("[data-openfullmath]").forEach(b=>b.onclick=()=>showSponsoredBreak("Mathematics",openFullMathBook));document.querySelectorAll("[data-downloadmathpdf]").forEach(b=>b.onclick=()=>showSponsoredBreak("Mathematics",downloadFullMathPDF));document.querySelectorAll("[data-openbook]").forEach(b=>b.onclick=()=>{let subject=b.dataset.openbook;showSponsoredBreak(subject,()=>openTextbook(subject))});document.querySelectorAll("[data-downloadbook]").forEach(b=>b.onclick=()=>{let subject=b.dataset.downloadbook;showSponsoredBreak(subject,()=>downloadBook(subject))});document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{let subject=b.dataset.sub;showSponsoredBreak(subject,()=>{selectedSubject=subject;go("study")})});let search=document.querySelector("#search");if(search)search.oninput=()=>document.querySelectorAll("[data-sub]").forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(search.value.toLowerCase()));let pick=document.querySelector("#subjectPick");if(pick)pick.onchange=()=>{let subject=pick.value;showSponsoredBreak(subject,()=>{selectedSubject=subject;document.querySelector("#topicList").innerHTML=topicList(selectedSubject);bindTopic()})};bindTopic();let ps=document.querySelector("#startPractice");if(ps)ps.onclick=()=>{let mode=document.querySelector("#mode").value;startQuiz(document.querySelector("#practiceSubject").value,+document.querySelector("#count").value,mode,+document.querySelector("#minutes").value)};document.querySelectorAll("[data-assignment]").forEach(b=>b.onclick=()=>{let subject=b.dataset.assignment;showSponsoredBreak(subject,()=>startQuiz(subject,10,"assignment",null))});document.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>{let subject=b.dataset.practice;showSponsoredBreak(subject,()=>{selectedSubject=subject;startQuiz(selectedSubject,20,"study",null)})});let exp=document.querySelector("#export");if(exp)exp.onclick=()=>download(JSON.stringify(state,null,2),"jamb-master-x-progress.json");let imp=document.querySelector("#import");if(imp)imp.onchange=async()=>{try{let o=JSON.parse(await imp.files[0].text());if(!Array.isArray(o.history)||!Array.isArray(o.bookmarks))throw 0;state=o;save();toast("Backup imported");go("home")}catch(e){toast("Invalid backup file")}};let clr=document.querySelector("#clear");if(clr)clr.onclick=()=>{if(confirm("Clear all locally saved progress?")){localStorage.removeItem(STORAGE);state=read();go("home")}}}
function bindTopic(){document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{let i=+b.dataset.read;let s=selectedSubject;document.querySelector("#app").innerHTML=lesson(s,i);document.querySelector("#markTopic").onclick=()=>{let key=s+"::"+DB.subjects[s][i][0];if(!state.doneTopics.includes(key))state.doneTopics.push(key);save();toast("Topic marked complete");go("study")};document.querySelector("#topicQuiz").onclick=()=>startQuiz(s,10,"study",null);document.querySelector("#backTopics").onclick=()=>go("study")});document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{let key=selectedSubject+"::"+DB.subjects[selectedSubject][+b.dataset.done][0];if(state.doneTopics.includes(key))state.doneTopics=state.doneTopics.filter(x=>x!==key);else state.doneTopics.push(key);save();document.querySelector("#topicList").innerHTML=topicList(selectedSubject);bindTopic()})}
function download(txt,name){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function render(){let views={home,subjects:subjectPage,study:studyPage,books:textbookLibrary,practice:practicePage,assignments:assignmentsPage,results:resultsPage,saved:savedPage,settings:settingsPage};document.querySelector("#app").innerHTML=(views[page]||home)();nav();bind()}
document.querySelector("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();let dark=state.theme==="dark";document.documentElement.style.setProperty("--bg",dark?"#111827":"#f3f6fb");document.documentElement.style.setProperty("--panel",dark?"#1d2939":"#fff");document.documentElement.style.setProperty("--ink",dark?"#f4f6fb":"#17243b");document.documentElement.style.setProperty("--muted",dark?"#b3bfd0":"#65748b");document.documentElement.style.setProperty("--line",dark?"#344054":"#e2e8f0")};
if(state.theme==="dark")document.querySelector("#theme").click();render();
