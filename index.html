const subjects=Object.keys(DB.subjects),icons=["📘","🔢","🧬","⚗️","⚡","📊","🏛️","📚","✝️","🛒","💻","🇫🇷","🌍","🏺","🌾","🧾","☪️","🏠","🎵","🎨","🔤","🗣️","🪶","🏃","🌐"];
const STORAGE="jamb_master_x_syllabus_v2";let state=read(),page="home",selectedSubject=subjects[0],quiz=null,clock=null;
function read(){try{return Object.assign({name:"Student",bookmarks:[],history:[],doneTopics:[],theme:"light"},JSON.parse(localStorage.getItem(STORAGE)||"{}"))}catch(e){return {name:"Student",bookmarks:[],history:[],doneTopics:[],theme:"light"}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)}
function nav(){document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===page))}
function go(p){clearInterval(clock);quiz=null;page=p;render();scrollTo(0,0)}
function header(k,t,d,btn=""){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${d}</p></div>${btn}</div>`}
function ad(){return `<div class="ad"><b>ADVERTISEMENT</b>Ad placement reserved. Add an approved ad network script after your site is hosted. No live ads are loaded in this offline file.</div>`}
function tile(s){let i=subjects.indexOf(s),n=DB.subjects[s].length;return `<button class="subject" data-sub="${esc(s)}"><span>${icons[i%icons.length]}</span><b>${esc(s)}</b><small>${n} syllabus units · 100 practice items</small></button>`}
function home(){let avg=state.history.length?Math.round(state.history.reduce((a,b)=>a+b.pct,0)/state.history.length):0;return `${header("YOUR UTME PREPARATION","Welcome to JAMB MASTER X","Prepare with a JAMB-inspired learning environment: read subject guides, study worked Mathematics examples, practise CBT questions and track your progress.",`<button class="btn" data-page="practice">Start practice →</button>`)}<div class="grid stats"><div class="card"><div class="statlabel">SUBJECTS</div><div class="stat">${subjects.length}</div></div><div class="card"><div class="statlabel">SYLLABUS TOPIC UNITS</div><div class="stat">${subjects.reduce((a,s)=>a+DB.subjects[s].length,0)}</div></div><div class="card"><div class="statlabel">PRACTICE ITEMS</div><div class="stat">${subjects.length*100}</div></div><div class="card"><div class="statlabel">AVERAGE SCORE</div><div class="stat">${avg}%</div></div></div><div class="card"><h2>Choose a subject</h2><p class="muted">Use of English is compulsory. Select three additional subjects that match your intended course and confirm the combination in the JAMB brochure.</p><div class="grid subjects">${subjects.map(tile).join("")}</div></div>${ad()}`}
function subjectPage(){return `${header("OFFICIAL SUBJECT DIRECTORY","All UTME subjects","Select a subject to view its syllabus structure, study notes, assignments and practice bank.")}<input class="field" id="search" placeholder="Search all subjects..." style="width:100%;max-width:420px;margin-bottom:14px"><div class="grid subjects" id="subgrid">${subjects.map(tile).join("")}</div>${ad()}`}
function studyPage(){return `${header("STUDY CENTRE","Read by syllabus topic","Choose a subject, open a topic, read the study guide and mark it complete.")}<select class="field" id="subjectPick">${subjects.map(s=>`<option ${s===selectedSubject?"selected":""}>${esc(s)}</option>`).join("")}</select><div id="topicList">${topicList(selectedSubject)}</div>${ad()}`}
function topicList(s){selectedSubject=s;return `<div class="card"><div class="row"><div><span class="pill">${DB.subjects[s].length} SYLLABUS UNITS</span><h2>${icons[subjects.indexOf(s)]} ${esc(s)}</h2></div><button class="btn alt" data-practice="${esc(s)}">Practise ${esc(s)}</button></div>${DB.subjects[s].map((t,i)=>{let key=s+"::"+t[0],done=state.doneTopics.includes(key);return `<article class="topic"><div class="row"><h3>${i+1}. ${esc(t[0])}</h3><span class="pill">${done?"COMPLETED":"NOT STARTED"}</span></div><p>${esc(t[1])}</p><div class="toolbar"><button class="btn alt" data-read="${i}">Read topic →</button><button class="btn line" data-done="${i}">${done?"Mark for revision":"Mark complete ✓"}</button></div></article>`}).join("")}</div>`}
function lesson(s,i){let t=DB.subjects[s][i],terms=DB.concepts[s],key=s+"::"+t[0];return `${header("TOPIC LESSON",esc(t[0]),esc(s)+" · Syllabus-aligned study guide")}<div class="card lessonbody"><span class="pill">LEARNING OBJECTIVE</span><p>By the end of this topic, you should be able to explain the key ideas, recognise important terms, apply the principles to examples and answer objective questions related to <b>${esc(t[0])}</b>.</p><h3>What to study</h3><p>${esc(t[1])}</p><h3>Core ideas and revision notes</h3><p>Read the topic description carefully. Make notes under these headings: definition and meaning; important features or principles; classifications and examples; processes, rules or formulae; applications; and common examination mistakes. For calculation topics, write out each step and include units. For language and literature topics, practise with examples from your prescribed texts.</p><h3>Key terms to revise</h3><ul>${terms.slice(0,6).map(x=>`<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join("")}</ul><h3>How to study this unit</h3><ol><li>Read your recommended textbook section for this topic.</li><li>Write a one-page summary in your own words.</li><li>Attempt 10 practice questions without checking the answers.</li><li>Review every explanation and note any weak area.</li></ol><div class="toolbar"><button class="btn" id="markTopic">Mark topic complete</button><button class="btn alt" id="topicQuiz">Practice this subject</button><button class="btn line" id="backTopics">Back to syllabus</button></div></div>${ad()}`}


const FULL_MATH_BOOK_HTML = "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>JAMB MASTER X Mathematics Textbook Vol. 1</title><style>\n:root{--ink:#182235;--blue:#153a70;--pale:#eef4fc;--line:#d8e1ee}*{box-sizing:border-box}\nbody{margin:0;background:#eef2f7;color:var(--ink);font:17px/1.75 Georgia,serif}header{background:#153a70;color:white;padding:42px 20px;text-align:center}\nheader h1{font:700 34px/1.2 Arial,sans-serif;margin:0}header p{font:16px Arial,sans-serif}\nmain{max-width:900px;margin:24px auto;background:white;padding:38px 46px;box-shadow:0 4px 24px #0001}\nh2,h3{font-family:Arial,sans-serif;line-height:1.3;color:var(--blue)}h2{font-size:25px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-top:34px}h3{font-size:18px;margin-top:24px}\np{margin:9px 0}.callout{background:var(--pale);border-left:4px solid #3473c5;padding:14px 18px;margin:16px 0}\n.example{background:#fbfcff;border:1px solid var(--line);border-radius:9px;padding:14px 18px;margin:14px 0}\n.toc a{color:var(--blue);text-decoration:none}.toc li{margin:6px 0}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid var(--line);padding:8px;text-align:left}\nbutton{position:fixed;right:18px;bottom:18px;background:#153a70;color:white;border:0;border-radius:24px;padding:13px 18px;font-weight:bold}\n@media(max-width:650px){main{margin:0;padding:24px 19px}body{font-size:16px}header h1{font-size:28px}}\n@media print{body{background:white}main{box-shadow:none;margin:0;max-width:none;padding:0 12mm}button{display:none}.chapter{break-before:page}}\n</style></head><body><header><h1>JAMB MASTER X</h1><h1>MATHEMATICS</h1><p>A Step-by-Step Learning Textbook · Volume 1</p></header><main>\n<div class=\"callout\"><b>About this book:</b> Original educational material with worked examples and practice. It is not the published New General Mathematics textbook or an official JAMB publication. Check the current JAMB syllabus at <a href=\"https://ibass.jamb.gov.ng/\">IBASS</a>.</div>\n<h2>How to use this book</h2><p>Study each explanation, attempt every worked example before reading its solution, and complete the chapter practice. Show your calculations clearly and check answers by substituting them into the original question.</p><h2>Contents</h2><ol class=\"toc\"><li><a href=\"#ch1\">Number Systems and Basic Operations</a></li><li><a href=\"#ch2\">Ratio, Proportion, Rates and Variation</a></li><li><a href=\"#ch3\">Indices, Standard Form and Logarithms</a></li><li><a href=\"#ch4\">Algebraic Expressions and Factorisation</a></li><li><a href=\"#ch5\">Linear Equations and Inequalities</a></li><li><a href=\"#ch6\">Simultaneous Linear Equations</a></li><li><a href=\"#ch7\">Quadratic Equations</a></li><li><a href=\"#ch8\">Sets, Venn Diagrams and Number of Elements</a></li><li><a href=\"#ch9\">Sequences, Series and Progressions</a></li><li><a href=\"#ch10\">Coordinate Geometry and Straight Lines</a></li><li><a href=\"#ch11\">Plane Geometry: Angles, Polygons and Circles</a></li><li><a href=\"#ch12\">Mensuration: Perimeter, Area, Surface Area and Volume</a></li><li><a href=\"#ch13\">Trigonometry and Bearings</a></li><li><a href=\"#ch14\">Statistics and Data Representation</a></li><li><a href=\"#ch15\">Probability</a></li><li><a href=\"#ch16\">Vectors and Basic Calculus</a></li></ol><section class=\"chapter\" id=\"ch1\"><p><b>CHAPTER 1</b></p><h2>Number Systems and Basic Operations</h2><p>Mathematics begins with numbers. Before solving equations or handling advanced topics, you must understand how numbers are classified, how they behave and how to calculate accurately. This chapter builds the number skills used throughout the UTME Mathematics syllabus.</p><h3>1.1 Types of numbers</h3><p class=\"\">Natural numbers are counting numbers: 1, 2, 3, 4, ... . Whole numbers include zero: 0, 1, 2, 3, ... . Integers include negative numbers as well: ..., −3, −2, −1, 0, 1, 2, 3, ... .</p><p class=\"\">Rational numbers can be written as a fraction a/b, where a and b are integers and b ≠ 0. Examples are 3/4, −5/2 and 0.125. Irrational numbers cannot be written as a ratio of two integers; examples include √2 and π. Real numbers include both rational and irrational numbers.</p><h3>1.2 Factors, multiples and prime numbers</h3><p class=\"\">A factor divides a number exactly. The factors of 18 are 1, 2, 3, 6, 9 and 18. A multiple is obtained by multiplying a number by an integer; multiples of 6 include 6, 12, 18 and 24.</p><p class=\"\">A prime number has exactly two positive factors: 1 and itself. Thus 2, 3, 5, 7 and 11 are prime. The number 1 is not prime. The highest common factor (HCF) is the largest factor shared by given numbers. The lowest common multiple (LCM) is the smallest positive number that is a multiple of all the given numbers.</p><h3>1.3 Fractions, decimals and percentages</h3><p class=\"\">A fraction represents part of a whole. To add or subtract fractions, first express them with a common denominator. To multiply fractions, multiply the numerators and denominators. To divide by a fraction, multiply by its reciprocal.</p><p class=\"\">A percentage means &#x27;per hundred&#x27;. To convert a percentage to a decimal, divide by 100. To convert a decimal to a percentage, multiply by 100.</p><h3>Worked Example 1: HCF and LCM</h3><p class=\"example\"><strong>Question:</strong> Find the HCF and LCM of 24 and 36.</p><p class=\"example\"><strong>Step 1 — prime factorise:</strong> 24 = 2³ × 3 and 36 = 2² × 3².</p><p class=\"example\"><strong>Step 2 — HCF:</strong> Use the common prime factors with the smaller powers: 2² × 3 = 12.</p><p class=\"example\"><strong>Step 3 — LCM:</strong> Use every prime factor with the larger powers: 2³ × 3² = 72.</p><p class=\"example\"><strong>Answer:</strong> HCF = 12; LCM = 72. Check: 12 divides both numbers, and 72 is divisible by both.</p><h3>Worked Example 2: Operations with fractions</h3><p class=\"example\"><strong>Question:</strong> Evaluate 3/4 + 5/6 − 1/3.</p><p class=\"example\"><strong>Step 1:</strong> The LCM of 4, 6 and 3 is 12.</p><p class=\"example\"><strong>Step 2:</strong> Convert each fraction: 3/4 = 9/12; 5/6 = 10/12; 1/3 = 4/12.</p><p class=\"example\"><strong>Step 3:</strong> 9/12 + 10/12 − 4/12 = 15/12.</p><p class=\"example\"><strong>Step 4:</strong> Simplify by dividing top and bottom by 3: 15/12 = 5/4 = 1¼.</p><p class=\"example\"><strong>Answer:</strong> 1¼.</p><h3>Worked Example 3: Percentage change</h3><p class=\"example\"><strong>Question:</strong> A school bag costs ₦8,000. Its price is increased by 15%. Find the new price.</p><p class=\"example\"><strong>Step 1:</strong> Increase = 15/100 × 8,000 = ₦1,200.</p><p class=\"example\"><strong>Step 2:</strong> New price = original price + increase = 8,000 + 1,200.</p><p class=\"example\"><strong>Answer:</strong> ₦9,200. A quicker method is 1.15 × 8,000 = ₦9,200.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Express 0.375 as a fraction in its lowest terms.</li><li>Find the HCF of 42 and 56.</li><li>Find the LCM of 8, 12 and 15.</li><li>Evaluate 2/3 + 3/5.</li><li>Increase ₦12,500 by 8%.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>3/8</td></tr><tr><td>2</td><td>14</td></tr><tr><td>3</td><td>120</td></tr><tr><td>4</td><td>19/15 or 1 4/15</td></tr><tr><td>5</td><td>₦13,500</td></tr></table></section><section class=\"chapter\" id=\"ch2\"><p><b>CHAPTER 2</b></p><h2>Ratio, Proportion, Rates and Variation</h2><p>Ratios compare quantities by division. Proportion describes equality between ratios. Rates compare quantities with different units, such as kilometres per hour or naira per kilogram. These ideas are common in everyday problems and examination questions.</p><h3>2.1 Ratio</h3><p class=\"\">A ratio a:b compares a with b. The quantities must be expressed in the same units before comparison. A ratio can be simplified by dividing both terms by their HCF.</p><p class=\"\">If a sum is shared in the ratio 2:3, the total number of parts is 2 + 3 = 5. The first person receives 2/5 of the sum and the second receives 3/5.</p><h3>2.2 Direct and inverse proportion</h3><p class=\"\">If y is directly proportional to x, then y = kx, where k is a constant. As x increases, y increases in the same ratio.</p><p class=\"\">If y is inversely proportional to x, then y = k/x. As x increases, y decreases so that xy remains constant.</p><h3>2.3 Rates and unit conversion</h3><p class=\"\">Speed = distance ÷ time. Density = mass ÷ volume. A unit rate gives the amount for one unit. Always convert units before substituting into a formula. For example, 2 hours 30 minutes = 2.5 hours.</p><h3>Worked Example 1: Sharing in a ratio</h3><p class=\"example\"><strong>Question:</strong> Share ₦45,000 between Ada and Bayo in the ratio 2:3.</p><p class=\"example\"><strong>Step 1:</strong> Total parts = 2 + 3 = 5.</p><p class=\"example\"><strong>Step 2:</strong> Value of one part = ₦45,000 ÷ 5 = ₦9,000.</p><p class=\"example\"><strong>Step 3:</strong> Ada receives 2 × ₦9,000 = ₦18,000. Bayo receives 3 × ₦9,000 = ₦27,000.</p><p class=\"example\"><strong>Check:</strong> ₦18,000 + ₦27,000 = ₦45,000.</p><h3>Worked Example 2: Direct proportion</h3><p class=\"example\"><strong>Question:</strong> If 4 exercise books cost ₦2,400, how much will 7 books cost at the same rate?</p><p class=\"example\"><strong>Step 1:</strong> Cost of one book = ₦2,400 ÷ 4 = ₦600.</p><p class=\"example\"><strong>Step 2:</strong> Cost of 7 books = 7 × ₦600.</p><p class=\"example\"><strong>Answer:</strong> ₦4,200.</p><h3>Worked Example 3: Inverse proportion</h3><p class=\"example\"><strong>Question:</strong> Six workers complete a job in 10 days. How many days will 15 workers take if they work at the same rate?</p><p class=\"example\"><strong>Step 1:</strong> Workers × days is constant = 6 × 10 = 60 worker-days.</p><p class=\"example\"><strong>Step 2:</strong> Let the required time be d. Then 15d = 60.</p><p class=\"example\"><strong>Step 3:</strong> d = 60 ÷ 15 = 4.</p><p class=\"example\"><strong>Answer:</strong> 4 days. This assumes equal productivity and that the job can be divided among workers.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Simplify 36:54.</li><li>Share ₦24,000 in the ratio 5:3.</li><li>If y ∝ x and y = 21 when x = 7, find y when x = 12.</li><li>A car travels 180 km in 3 hours. Find its average speed.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>2:3</td></tr><tr><td>2</td><td>₦15,000 and ₦9,000</td></tr><tr><td>3</td><td>36</td></tr><tr><td>4</td><td>60 km/h</td></tr></table></section><section class=\"chapter\" id=\"ch3\"><p><b>CHAPTER 3</b></p><h2>Indices, Standard Form and Logarithms</h2><p>Indices provide a short way to write repeated multiplication. Standard form makes very large and very small numbers easier to handle. Logarithms reverse the operation of raising a number to a power.</p><h3>3.1 Laws of indices</h3><p class=\"\">For a ≠ 0: aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ; and a¹/ⁿ = ⁿ√a.</p><p class=\"\">These laws apply when the bases are the same. Do not add exponents when the bases are different.</p><h3>3.2 Standard form</h3><p class=\"\">A number in standard form is written A × 10ⁿ, where 1 ≤ A &lt; 10 and n is an integer. For example, 45,600 = 4.56 × 10⁴ and 0.00072 = 7.2 × 10⁻⁴.</p><h3>3.3 Logarithms</h3><p class=\"\">If aˣ = N, then logₐN = x. For example, because 2³ = 8, log₂8 = 3. The basic laws are logₐ(MN) = logₐM + logₐN; logₐ(M/N) = logₐM − logₐN; and logₐ(Mʳ) = r logₐM.</p><p class=\"\">For real logarithms, the base must be positive and not equal to 1, and the argument must be positive.</p><h3>Worked Example 1: Simplifying indices</h3><p class=\"example\"><strong>Question:</strong> Simplify (2³ × 2⁵) ÷ 2⁴.</p><p class=\"example\"><strong>Step 1:</strong> Multiply powers with the same base by adding indices: 2³ × 2⁵ = 2⁸.</p><p class=\"example\"><strong>Step 2:</strong> Divide powers with the same base by subtracting indices: 2⁸ ÷ 2⁴ = 2⁴.</p><p class=\"example\"><strong>Step 3:</strong> 2⁴ = 16.</p><p class=\"example\"><strong>Answer:</strong> 16.</p><h3>Worked Example 2: Negative and fractional indices</h3><p class=\"example\"><strong>Question:</strong> Evaluate 16⁻¹/².</p><p class=\"example\"><strong>Step 1:</strong> The exponent −1/2 means take the reciprocal of the square root.</p><p class=\"example\"><strong>Step 2:</strong> √16 = 4.</p><p class=\"example\"><strong>Step 3:</strong> 16⁻¹/² = 1/√16 = 1/4.</p><p class=\"example\"><strong>Answer:</strong> 1/4.</p><h3>Worked Example 3: Standard form calculation</h3><p class=\"example\"><strong>Question:</strong> Calculate (3 × 10⁵)(2 × 10³).</p><p class=\"example\"><strong>Step 1:</strong> Multiply the ordinary numbers: 3 × 2 = 6.</p><p class=\"example\"><strong>Step 2:</strong> Multiply powers of ten: 10⁵ × 10³ = 10⁸.</p><p class=\"example\"><strong>Answer:</strong> 6 × 10⁸.</p><h3>Worked Example 4: Logarithm</h3><p class=\"example\"><strong>Question:</strong> Solve log₂x = 5.</p><p class=\"example\"><strong>Step 1:</strong> Convert to index form: 2⁵ = x.</p><p class=\"example\"><strong>Step 2:</strong> Evaluate 2⁵ = 32.</p><p class=\"example\"><strong>Answer:</strong> x = 32.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Evaluate 3² × 3⁴ ÷ 3³.</li><li>Express 0.000056 in standard form.</li><li>Evaluate 81¹/².</li><li>If log₁₀x = 2, find x.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>27</td></tr><tr><td>2</td><td>5.6 × 10⁻⁵</td></tr><tr><td>3</td><td>9</td></tr><tr><td>4</td><td>100</td></tr></table></section><section class=\"chapter\" id=\"ch4\"><p><b>CHAPTER 4</b></p><h2>Algebraic Expressions and Factorisation</h2><p>Algebra uses letters to represent numbers. It allows us to describe patterns, write general rules and solve problems when a value is unknown. A strong understanding of algebra is essential for equations, graphs and many later topics.</p><h3>4.1 Terms, coefficients and like terms</h3><p class=\"\">In 7x + 3, the terms are 7x and 3. The coefficient of x is 7. Like terms contain the same variables raised to the same powers: 3x and −5x are like terms, but 3x and 3x² are not.</p><p class=\"\">To simplify an expression, collect like terms. For example, 4a + 3b − 2a + b = 2a + 4b.</p><h3>4.2 Expanding brackets</h3><p class=\"\">Use the distributive law: a(b + c) = ab + ac. Multiply every term inside the bracket by the term outside.</p><p class=\"\">For two brackets, multiply each term in the first bracket by each term in the second bracket, then collect like terms.</p><h3>4.3 Factorisation</h3><p class=\"\">Factorisation reverses expansion. Common methods include taking out a common factor, grouping terms, using difference of two squares, and factorising monic quadratic expressions.</p><p class=\"\">Remember: a² − b² = (a − b)(a + b).</p><h3>Worked Example 1: Simplifying</h3><p class=\"example\"><strong>Question:</strong> Simplify 5x − 3y + 2x + 7y − 4.</p><p class=\"example\"><strong>Step 1:</strong> Collect x terms: 5x + 2x = 7x.</p><p class=\"example\"><strong>Step 2:</strong> Collect y terms: −3y + 7y = 4y.</p><p class=\"example\"><strong>Step 3:</strong> Keep the constant −4.</p><p class=\"example\"><strong>Answer:</strong> 7x + 4y − 4.</p><h3>Worked Example 2: Expanding</h3><p class=\"example\"><strong>Question:</strong> Expand 3(2x − 5) − 2(x + 4).</p><p class=\"example\"><strong>Step 1:</strong> Expand each bracket: 6x − 15 − 2x − 8.</p><p class=\"example\"><strong>Step 2:</strong> Collect like terms: 6x − 2x = 4x and −15 − 8 = −23.</p><p class=\"example\"><strong>Answer:</strong> 4x − 23.</p><h3>Worked Example 3: Factorising a quadratic</h3><p class=\"example\"><strong>Question:</strong> Factorise x² + 7x + 12.</p><p class=\"example\"><strong>Step 1:</strong> Find two numbers whose product is 12 and whose sum is 7. The numbers are 3 and 4.</p><p class=\"example\"><strong>Step 2:</strong> Split the middle term: x² + 3x + 4x + 12.</p><p class=\"example\"><strong>Step 3:</strong> Group: x(x + 3) + 4(x + 3).</p><p class=\"example\"><strong>Step 4:</strong> Take out the common bracket.</p><p class=\"example\"><strong>Answer:</strong> (x + 3)(x + 4).</p><h3>Worked Example 4: Difference of two squares</h3><p class=\"example\"><strong>Question:</strong> Factorise 9a² − 25.</p><p class=\"example\"><strong>Step 1:</strong> Recognise 9a² = (3a)² and 25 = 5².</p><p class=\"example\"><strong>Step 2:</strong> Apply A² − B² = (A − B)(A + B).</p><p class=\"example\"><strong>Answer:</strong> (3a − 5)(3a + 5).</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Simplify 8p − 3q − 2p + 5q.</li><li>Expand 4(3x − 2).</li><li>Factorise x² + 9x + 20.</li><li>Factorise 16m² − 81.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>6p + 2q</td></tr><tr><td>2</td><td>12x − 8</td></tr><tr><td>3</td><td>(x + 4)(x + 5)</td></tr><tr><td>4</td><td>(4m − 9)(4m + 9)</td></tr></table></section><section class=\"chapter\" id=\"ch5\"><p><b>CHAPTER 5</b></p><h2>Linear Equations and Inequalities</h2><p>An equation states that two expressions have equal values. Solving an equation means finding the value or values of the unknown that make the statement true. The key rule is to perform the same operation on both sides.</p><h3>5.1 Solving linear equations</h3><p class=\"\">A linear equation in one unknown has the unknown to the first power. To solve it, simplify both sides, collect unknown terms on one side and constants on the other, then isolate the unknown.</p><p class=\"\">Whatever operation is performed on one side must also be performed on the other side to preserve equality.</p><h3>5.2 Equations with brackets and fractions</h3><p class=\"\">Clear brackets carefully before collecting terms. If fractions occur, multiply every term by the lowest common denominator (LCD). This removes denominators without changing the solution, provided the multiplier is non-zero.</p><h3>5.3 Inequalities</h3><p class=\"\">The symbols are &lt; (less than), &gt; (greater than), ≤ (less than or equal to) and ≥ (greater than or equal to). Solve inequalities much like equations, but reverse the inequality sign whenever you multiply or divide both sides by a negative number.</p><h3>Worked Example 1: Basic equation</h3><p class=\"example\"><strong>Question:</strong> Solve 5x − 7 = 18.</p><p class=\"example\"><strong>Step 1:</strong> Add 7 to both sides: 5x = 25.</p><p class=\"example\"><strong>Step 2:</strong> Divide both sides by 5: x = 5.</p><p class=\"example\"><strong>Check:</strong> 5(5) − 7 = 25 − 7 = 18. The answer is correct.</p><h3>Worked Example 2: Unknown on both sides</h3><p class=\"example\"><strong>Question:</strong> Solve 7x + 4 = 3x + 20.</p><p class=\"example\"><strong>Step 1:</strong> Subtract 3x from both sides: 4x + 4 = 20.</p><p class=\"example\"><strong>Step 2:</strong> Subtract 4: 4x = 16.</p><p class=\"example\"><strong>Step 3:</strong> Divide by 4: x = 4.</p><p class=\"example\"><strong>Check:</strong> Left side = 32; right side = 32.</p><h3>Worked Example 3: Equation involving fractions</h3><p class=\"example\"><strong>Question:</strong> Solve (x − 1)/3 = 4.</p><p class=\"example\"><strong>Step 1:</strong> Multiply both sides by 3: x − 1 = 12.</p><p class=\"example\"><strong>Step 2:</strong> Add 1 to both sides: x = 13.</p><p class=\"example\"><strong>Answer:</strong> x = 13.</p><h3>Worked Example 4: Inequality</h3><p class=\"example\"><strong>Question:</strong> Solve −2x + 6 &gt; 14.</p><p class=\"example\"><strong>Step 1:</strong> Subtract 6: −2x &gt; 8.</p><p class=\"example\"><strong>Step 2:</strong> Divide by −2 and reverse the sign: x &lt; −4.</p><p class=\"example\"><strong>Answer:</strong> x &lt; −4.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Solve 4x + 9 = 29.</li><li>Solve 9x − 5 = 4x + 20.</li><li>Solve (2x + 1)/5 = 3.</li><li>Solve −3x ≤ 12.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>x = 5</td></tr><tr><td>2</td><td>x = 5</td></tr><tr><td>3</td><td>x = 7</td></tr><tr><td>4</td><td>x ≥ −4</td></tr></table></section><section class=\"chapter\" id=\"ch6\"><p><b>CHAPTER 6</b></p><h2>Simultaneous Linear Equations</h2><p>A pair of simultaneous equations must be satisfied by the same values of the unknowns. The solution is the point where the two relationships are both true. Common algebraic methods are substitution and elimination.</p><h3>6.1 Elimination method</h3><p class=\"\">Arrange both equations so that like terms are aligned. Multiply one or both equations if necessary to make the coefficients of one unknown equal or opposites. Add or subtract the equations to eliminate that unknown, then substitute back.</p><h3>6.2 Substitution method</h3><p class=\"\">Rearrange one equation to make one unknown the subject. Substitute that expression into the other equation. Solve the resulting equation in one unknown, then substitute back.</p><h3>Worked Example 1: Elimination</h3><p class=\"example\"><strong>Question:</strong> Solve 2x + y = 11 and x − y = 1.</p><p class=\"example\"><strong>Step 1:</strong> Add the equations: (2x + y) + (x − y) = 11 + 1.</p><p class=\"example\"><strong>Step 2:</strong> The y terms cancel: 3x = 12, so x = 4.</p><p class=\"example\"><strong>Step 3:</strong> Substitute x = 4 into x − y = 1: 4 − y = 1.</p><p class=\"example\"><strong>Step 4:</strong> −y = −3, so y = 3.</p><p class=\"example\"><strong>Answer:</strong> x = 4, y = 3. Check in the first equation: 8 + 3 = 11.</p><h3>Worked Example 2: Substitution</h3><p class=\"example\"><strong>Question:</strong> Solve y = 2x + 1 and 3x + y = 16.</p><p class=\"example\"><strong>Step 1:</strong> Substitute y = 2x + 1 into the second equation: 3x + 2x + 1 = 16.</p><p class=\"example\"><strong>Step 2:</strong> 5x + 1 = 16, so 5x = 15 and x = 3.</p><p class=\"example\"><strong>Step 3:</strong> y = 2(3) + 1 = 7.</p><p class=\"example\"><strong>Answer:</strong> x = 3, y = 7.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Solve x + y = 9 and x − y = 3.</li><li>Solve 2x + y = 8 and x + y = 5.</li><li>Solve y = x + 4 and 2x + y = 13.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>x = 6, y = 3</td></tr><tr><td>2</td><td>x = 3, y = 2</td></tr><tr><td>3</td><td>x = 3, y = 7</td></tr></table></section><section class=\"chapter\" id=\"ch7\"><p><b>CHAPTER 7</b></p><h2>Quadratic Equations</h2><p>A quadratic equation has the form ax² + bx + c = 0, where a ≠ 0. Its solutions are called roots. Quadratics can be solved by factorisation, completing the square or the quadratic formula.</p><h3>7.1 Factorisation method</h3><p class=\"\">Write the equation in the form ax² + bx + c = 0. Factorise the expression into two brackets. If AB = 0, then A = 0 or B = 0. Solve each resulting linear equation.</p><h3>7.2 Quadratic formula and discriminant</h3><p class=\"\">For ax² + bx + c = 0, x = [−b ± √(b² − 4ac)]/(2a). The discriminant D = b² − 4ac tells us about the roots: D &gt; 0 gives two distinct real roots; D = 0 gives equal real roots; D &lt; 0 gives no real roots.</p><h3>Worked Example 1: Factorisation</h3><p class=\"example\"><strong>Question:</strong> Solve x² − 5x + 6 = 0.</p><p class=\"example\"><strong>Step 1:</strong> Find two numbers with product +6 and sum −5: −2 and −3.</p><p class=\"example\"><strong>Step 2:</strong> Factorise: (x − 2)(x − 3) = 0.</p><p class=\"example\"><strong>Step 3:</strong> x − 2 = 0 or x − 3 = 0.</p><p class=\"example\"><strong>Answer:</strong> x = 2 or x = 3.</p><h3>Worked Example 2: Quadratic formula</h3><p class=\"example\"><strong>Question:</strong> Solve 2x² + 3x − 2 = 0.</p><p class=\"example\"><strong>Step 1:</strong> Identify a = 2, b = 3, c = −2.</p><p class=\"example\"><strong>Step 2:</strong> Substitute: x = [−3 ± √(3² − 4(2)(−2))]/[2(2)].</p><p class=\"example\"><strong>Step 3:</strong> x = [−3 ± √(9 + 16)]/4 = [−3 ± 5]/4.</p><p class=\"example\"><strong>Step 4:</strong> x = (−3 + 5)/4 = 1/2, or x = (−3 − 5)/4 = −2.</p><p class=\"example\"><strong>Answer:</strong> x = 1/2 or x = −2.</p><h3>Worked Example 3: Discriminant</h3><p class=\"example\"><strong>Question:</strong> Determine the nature of the roots of 3x² + 2x + 4 = 0.</p><p class=\"example\"><strong>Step 1:</strong> a = 3, b = 2, c = 4.</p><p class=\"example\"><strong>Step 2:</strong> D = b² − 4ac = 2² − 4(3)(4) = 4 − 48 = −44.</p><p class=\"example\"><strong>Conclusion:</strong> D is negative, so the equation has no real roots.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Solve x² − 7x + 10 = 0.</li><li>Solve x² + x − 12 = 0.</li><li>Find the discriminant of x² − 4x + 4 = 0.</li><li>Solve 3x² − 12 = 0.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>x = 2 or 5</td></tr><tr><td>2</td><td>x = 3 or −4</td></tr><tr><td>3</td><td>0</td></tr><tr><td>4</td><td>x = ±2</td></tr></table></section><section class=\"chapter\" id=\"ch8\"><p><b>CHAPTER 8</b></p><h2>Sets, Venn Diagrams and Number of Elements</h2><p>A set is a well-defined collection of objects. Set language is useful for classifying information and solving counting problems. Venn diagrams show relationships between sets visually.</p><h3>8.1 Set notation</h3><p class=\"\">Capital letters usually name sets. x ∈ A means x belongs to A; x ∉ A means it does not. The empty set is ∅. The universal set U contains all objects being considered. The complement A′ contains elements in U that are not in A.</p><p class=\"\">The union A ∪ B contains elements in A or B or both. The intersection A ∩ B contains elements common to both.</p><h3>8.2 Counting formula</h3><p class=\"\">For two finite sets, n(A ∪ B) = n(A) + n(B) − n(A ∩ B). The intersection is subtracted because it was counted twice when the two set sizes were added.</p><h3>Worked Example 1: Two-set problem</h3><p class=\"example\"><strong>Question:</strong> In a class of 40 students, 23 study Mathematics, 18 study Physics and 10 study both. How many study at least one of the two subjects?</p><p class=\"example\"><strong>Step 1:</strong> Use n(M ∪ P) = n(M) + n(P) − n(M ∩ P).</p><p class=\"example\"><strong>Step 2:</strong> Substitute: 23 + 18 − 10 = 31.</p><p class=\"example\"><strong>Answer:</strong> 31 students study at least one. Those studying neither = 40 − 31 = 9.</p><h3>Worked Example 2: Exactly one set</h3><p class=\"example\"><strong>Question:</strong> Using the information above, how many study Mathematics only?</p><p class=\"example\"><strong>Step 1:</strong> Mathematics only = n(M) − n(M ∩ P).</p><p class=\"example\"><strong>Step 2:</strong> 23 − 10 = 13.</p><p class=\"example\"><strong>Answer:</strong> 13 students.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>If n(A)=15, n(B)=12 and n(A∩B)=5, find n(A∪B).</li><li>If n(U)=50 and n(A)=31, find n(A′).</li><li>In a group, 20 like rice, 17 like beans and 8 like both. How many like only rice?</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>22</td></tr><tr><td>2</td><td>19</td></tr><tr><td>3</td><td>12</td></tr></table></section><section class=\"chapter\" id=\"ch9\"><p><b>CHAPTER 9</b></p><h2>Sequences, Series and Progressions</h2><p>A sequence is an ordered list of numbers following a rule. A series is the sum of terms in a sequence. Arithmetic and geometric progressions are two important types.</p><h3>9.1 Arithmetic progression (AP)</h3><p class=\"\">In an AP, the difference between consecutive terms is constant. This difference is called the common difference d. The nth term is Tₙ = a + (n − 1)d, where a is the first term.</p><p class=\"\">The sum of the first n terms is Sₙ = n/2[2a + (n − 1)d] or Sₙ = n/2(a + l), where l is the last term.</p><h3>9.2 Geometric progression (GP)</h3><p class=\"\">In a GP, each term is obtained by multiplying the previous term by a constant ratio r. The nth term is Tₙ = arⁿ⁻¹. For r ≠ 1, the sum of the first n terms is Sₙ = a(rⁿ − 1)/(r − 1).</p><h3>Worked Example 1: AP nth term</h3><p class=\"example\"><strong>Question:</strong> Find the 20th term of 4, 7, 10, 13, ... .</p><p class=\"example\"><strong>Step 1:</strong> First term a = 4; common difference d = 7 − 4 = 3.</p><p class=\"example\"><strong>Step 2:</strong> Tₙ = a + (n − 1)d.</p><p class=\"example\"><strong>Step 3:</strong> T₂₀ = 4 + 19(3) = 4 + 57.</p><p class=\"example\"><strong>Answer:</strong> 61.</p><h3>Worked Example 2: Sum of an AP</h3><p class=\"example\"><strong>Question:</strong> Find the sum of the first 15 terms of 2, 5, 8, 11, ... .</p><p class=\"example\"><strong>Step 1:</strong> a = 2, d = 3, n = 15.</p><p class=\"example\"><strong>Step 2:</strong> Sₙ = n/2[2a + (n − 1)d].</p><p class=\"example\"><strong>Step 3:</strong> S₁₅ = 15/2[4 + 14(3)] = 15/2(46).</p><p class=\"example\"><strong>Answer:</strong> 345.</p><h3>Worked Example 3: GP term</h3><p class=\"example\"><strong>Question:</strong> Find the 6th term of 3, 6, 12, 24, ... .</p><p class=\"example\"><strong>Step 1:</strong> a = 3 and r = 2.</p><p class=\"example\"><strong>Step 2:</strong> T₆ = ar⁵ = 3 × 2⁵ = 3 × 32.</p><p class=\"example\"><strong>Answer:</strong> 96.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the 12th term of 5, 9, 13, ... .</li><li>Find the sum of the first 10 positive integers.</li><li>Find the 5th term of 2, 6, 18, ... .</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>49</td></tr><tr><td>2</td><td>55</td></tr><tr><td>3</td><td>162</td></tr></table></section><section class=\"chapter\" id=\"ch10\"><p><b>CHAPTER 10</b></p><h2>Coordinate Geometry and Straight Lines</h2><p>Coordinate geometry connects algebra and geometry. A point is described by an ordered pair (x, y). Equations can describe lines, and gradients measure how steeply a line rises or falls.</p><h3>10.1 Cartesian coordinates</h3><p class=\"\">The horizontal axis is the x-axis and the vertical axis is the y-axis. Their intersection is the origin (0, 0). A point is written (x, y), with the x-coordinate first.</p><h3>10.2 Gradient and equation of a line</h3><p class=\"\">For points (x₁, y₁) and (x₂, y₂), gradient m = (y₂ − y₁)/(x₂ − x₁), provided x₂ ≠ x₁. A straight line can be written y = mx + c, where m is the gradient and c is the y-intercept.</p><p class=\"\">Parallel non-vertical lines have equal gradients. Perpendicular lines have gradients whose product is −1.</p><h3>Worked Example 1: Gradient</h3><p class=\"example\"><strong>Question:</strong> Find the gradient of the line through A(2, 3) and B(6, 11).</p><p class=\"example\"><strong>Step 1:</strong> m = (y₂ − y₁)/(x₂ − x₁).</p><p class=\"example\"><strong>Step 2:</strong> m = (11 − 3)/(6 − 2) = 8/4.</p><p class=\"example\"><strong>Answer:</strong> m = 2.</p><h3>Worked Example 2: Equation of a line</h3><p class=\"example\"><strong>Question:</strong> Find the equation of a line with gradient 3 passing through (2, 5).</p><p class=\"example\"><strong>Step 1:</strong> Use y = mx + c. Put m = 3: y = 3x + c.</p><p class=\"example\"><strong>Step 2:</strong> Substitute (2, 5): 5 = 3(2) + c.</p><p class=\"example\"><strong>Step 3:</strong> 5 = 6 + c, so c = −1.</p><p class=\"example\"><strong>Answer:</strong> y = 3x − 1.</p><h3>Worked Example 3: Midpoint</h3><p class=\"example\"><strong>Question:</strong> Find the midpoint of (−2, 4) and (6, 8).</p><p class=\"example\"><strong>Step 1:</strong> Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2).</p><p class=\"example\"><strong>Step 2:</strong> = ((−2 + 6)/2, (4 + 8)/2) = (4/2, 12/2).</p><p class=\"example\"><strong>Answer:</strong> (2, 6).</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the gradient through (1, 2) and (5, 10).</li><li>Find the midpoint of (3, −1) and (7, 5).</li><li>Find c if y = 4x + c passes through (2, 3).</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>2</td></tr><tr><td>2</td><td>(5, 2)</td></tr><tr><td>3</td><td>−5</td></tr></table></section><section class=\"chapter\" id=\"ch11\"><p><b>CHAPTER 11</b></p><h2>Plane Geometry: Angles, Polygons and Circles</h2><p>Geometry studies shapes, sizes, angles and spatial relationships. Correct diagrams and accurate angle rules make many geometry questions easier. Always identify the rule before calculating.</p><h3>11.1 Angles and parallel lines</h3><p class=\"\">Angles on a straight line add up to 180°. Angles around a point add up to 360°. Vertically opposite angles are equal. When a transversal crosses parallel lines, corresponding angles are equal and alternate angles are equal; co-interior angles add up to 180°.</p><h3>11.2 Triangles and polygons</h3><p class=\"\">The interior angles of a triangle add up to 180°. An exterior angle of a triangle equals the sum of the two opposite interior angles. The sum of the interior angles of an n-sided polygon is (n − 2) × 180°.</p><p class=\"\">For a regular polygon, each interior angle is [(n − 2) × 180°]/n.</p><h3>11.3 Circle theorems</h3><p class=\"\">An angle at the centre is twice the angle at the circumference standing on the same arc. Angles in the same segment are equal. The angle in a semicircle is 90°. Opposite angles of a cyclic quadrilateral add up to 180°. A tangent is perpendicular to the radius at the point of contact.</p><h3>Worked Example 1: Triangle angles</h3><p class=\"example\"><strong>Question:</strong> Two angles of a triangle are 48° and 67°. Find the third angle.</p><p class=\"example\"><strong>Step 1:</strong> Sum of angles in a triangle = 180°.</p><p class=\"example\"><strong>Step 2:</strong> Third angle = 180° − (48° + 67°) = 180° − 115°.</p><p class=\"example\"><strong>Answer:</strong> 65°.</p><h3>Worked Example 2: Regular polygon</h3><p class=\"example\"><strong>Question:</strong> Find each interior angle of a regular hexagon.</p><p class=\"example\"><strong>Step 1:</strong> n = 6. Sum of interior angles = (6 − 2) × 180° = 720°.</p><p class=\"example\"><strong>Step 2:</strong> Each angle = 720° ÷ 6.</p><p class=\"example\"><strong>Answer:</strong> 120°.</p><h3>Worked Example 3: Cyclic quadrilateral</h3><p class=\"example\"><strong>Question:</strong> One angle of a cyclic quadrilateral is 112°. Find its opposite angle.</p><p class=\"example\"><strong>Step 1:</strong> Opposite angles in a cyclic quadrilateral add up to 180°.</p><p class=\"example\"><strong>Step 2:</strong> Opposite angle = 180° − 112°.</p><p class=\"example\"><strong>Answer:</strong> 68°.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the supplement of 137°.</li><li>Find the sum of interior angles of an octagon.</li><li>A cyclic quadrilateral has one angle 95°. Find its opposite angle.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>43°</td></tr><tr><td>2</td><td>1080°</td></tr><tr><td>3</td><td>85°</td></tr></table></section><section class=\"chapter\" id=\"ch12\"><p><b>CHAPTER 12</b></p><h2>Mensuration: Perimeter, Area, Surface Area and Volume</h2><p>Mensuration deals with measurement of length, area, surface area and volume. The first step in every mensuration problem is to identify the shape, write the correct formula and convert all measurements to consistent units.</p><h3>12.1 Perimeter and area</h3><p class=\"\">Rectangle: perimeter = 2(l + w), area = lw. Square: perimeter = 4s, area = s². Triangle: area = ½bh. Parallelogram: area = bh. Trapezium: area = ½(a + b)h.</p><p class=\"\">Circle: circumference C = 2πr = πd; area A = πr². Here r is radius and d is diameter.</p><h3>12.2 Surface area and volume</h3><p class=\"\">Cuboid: volume = lwh; total surface area = 2(lw + lh + wh). Cube: volume = s³; total surface area = 6s².</p><p class=\"\">Cylinder: volume = πr²h; curved surface area = 2πrh. Cone: volume = ⅓πr²h. Sphere: volume = 4/3πr³; surface area = 4πr².</p><h3>Worked Example 1: Area of a trapezium</h3><p class=\"example\"><strong>Question:</strong> A trapezium has parallel sides 8 cm and 14 cm, and height 5 cm. Find its area.</p><p class=\"example\"><strong>Step 1:</strong> A = ½(a + b)h.</p><p class=\"example\"><strong>Step 2:</strong> A = ½(8 + 14) × 5 = ½ × 22 × 5.</p><p class=\"example\"><strong>Answer:</strong> 55 cm².</p><h3>Worked Example 2: Cylinder volume</h3><p class=\"example\"><strong>Question:</strong> A cylinder has radius 3 cm and height 10 cm. Find its volume in terms of π.</p><p class=\"example\"><strong>Step 1:</strong> V = πr²h.</p><p class=\"example\"><strong>Step 2:</strong> V = π × 3² × 10.</p><p class=\"example\"><strong>Step 3:</strong> V = π × 9 × 10.</p><p class=\"example\"><strong>Answer:</strong> 90π cm³, approximately 282.7 cm³.</p><h3>Worked Example 3: Cost of tiling</h3><p class=\"example\"><strong>Question:</strong> A rectangular floor is 6 m long and 4 m wide. Tiles cover 0.5 m² each. How many tiles are needed, ignoring wastage?</p><p class=\"example\"><strong>Step 1:</strong> Floor area = 6 × 4 = 24 m².</p><p class=\"example\"><strong>Step 2:</strong> Number of tiles = 24 ÷ 0.5.</p><p class=\"example\"><strong>Answer:</strong> 48 tiles. In a real project, extra tiles may be needed for cuts and breakage.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the area of a circle of radius 7 cm, using π = 22/7.</li><li>Find the volume of a cube of side 4 cm.</li><li>A rectangle is 12 cm by 5 cm. Find its perimeter.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>154 cm²</td></tr><tr><td>2</td><td>64 cm³</td></tr><tr><td>3</td><td>34 cm</td></tr></table></section><section class=\"chapter\" id=\"ch13\"><p><b>CHAPTER 13</b></p><h2>Trigonometry and Bearings</h2><p>Trigonometry relates the angles and sides of triangles. In a right-angled triangle, the three basic ratios are sine, cosine and tangent. Bearings describe direction measured clockwise from north.</p><h3>13.1 The three trigonometric ratios</h3><p class=\"\">For an acute angle θ in a right-angled triangle: sin θ = opposite/hypotenuse; cos θ = adjacent/hypotenuse; tan θ = opposite/adjacent. Remember SOH–CAH–TOA.</p><p class=\"\">The hypotenuse is the longest side and lies opposite the right angle. The opposite and adjacent sides depend on the angle being considered.</p><h3>13.2 Finding a missing side or angle</h3><p class=\"\">Choose the ratio that connects the known side and the unknown side. Substitute the values and rearrange. To find an angle, use inverse trigonometric functions: θ = sin⁻¹(value), cos⁻¹(value) or tan⁻¹(value). Check that the calculator is in degree mode when the question uses degrees.</p><h3>13.3 Bearings</h3><p class=\"\">A three-figure bearing is measured clockwise from north. For example, east is 090°, south is 180° and west is 270°. Draw a north line at the starting point and measure clockwise.</p><h3>Worked Example 1: Finding a side</h3><p class=\"example\"><strong>Question:</strong> In a right triangle, an angle is 30° and the hypotenuse is 12 cm. Find the opposite side.</p><p class=\"example\"><strong>Step 1:</strong> Use sine because opposite and hypotenuse are involved: sin 30° = opposite/12.</p><p class=\"example\"><strong>Step 2:</strong> sin 30° = 0.5, so opposite = 12 × 0.5.</p><p class=\"example\"><strong>Answer:</strong> 6 cm.</p><h3>Worked Example 2: Finding an angle</h3><p class=\"example\"><strong>Question:</strong> A right triangle has opposite side 5 cm and adjacent side 12 cm. Find θ.</p><p class=\"example\"><strong>Step 1:</strong> tan θ = 5/12.</p><p class=\"example\"><strong>Step 2:</strong> θ = tan⁻¹(5/12).</p><p class=\"example\"><strong>Answer:</strong> θ ≈ 22.6°.</p><h3>Worked Example 3: Height and distance</h3><p class=\"example\"><strong>Question:</strong> A person stands 20 m from the foot of a vertical tower. The angle of elevation to the top is 45°. Find the tower&#x27;s height, assuming level ground.</p><p class=\"example\"><strong>Step 1:</strong> Opposite = height h; adjacent = 20 m. Use tan 45° = h/20.</p><p class=\"example\"><strong>Step 2:</strong> tan 45° = 1, so h = 20 × 1.</p><p class=\"example\"><strong>Answer:</strong> 20 m.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>If sin θ = 3/5 for an acute angle, find cos θ.</li><li>Find tan 45° × 8.</li><li>A bearing of due east is what three-figure bearing?</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>4/5</td></tr><tr><td>2</td><td>8</td></tr><tr><td>3</td><td>090°</td></tr></table></section><section class=\"chapter\" id=\"ch14\"><p><b>CHAPTER 14</b></p><h2>Statistics and Data Representation</h2><p>Statistics is the collection, organisation, presentation, analysis and interpretation of data. UTME questions may require you to calculate averages, interpret tables and graphs, or identify the most suitable measure for a data set.</p><h3>14.1 Mean, median and mode</h3><p class=\"\">The mean is the sum of observations divided by the number of observations. The median is the middle value after arranging data in order. The mode is the value that occurs most frequently.</p><p class=\"\">For a frequency table, mean = Σfx/Σf, where x is a value and f is its frequency.</p><h3>14.2 Range and charts</h3><p class=\"\">Range = highest value − lowest value. A bar chart compares categories using separated bars. A histogram represents grouped continuous data with touching bars. A pie chart represents a whole using sectors whose angles total 360°.</p><p class=\"\">Sector angle = (category frequency ÷ total frequency) × 360°.</p><h3>Worked Example 1: Mean, median and mode</h3><p class=\"example\"><strong>Question:</strong> Find the mean, median, mode and range of 2, 3, 3, 5, 7.</p><p class=\"example\"><strong>Mean:</strong> Sum = 2 + 3 + 3 + 5 + 7 = 20. There are 5 values, so mean = 20/5 = 4.</p><p class=\"example\"><strong>Median:</strong> The data are already arranged. The middle (third) value is 3.</p><p class=\"example\"><strong>Mode:</strong> 3 occurs most often, so mode = 3.</p><p class=\"example\"><strong>Range:</strong> 7 − 2 = 5.</p><h3>Worked Example 2: Mean from a frequency table</h3><p class=\"example\"><strong>Question:</strong> Values 1, 2 and 3 have frequencies 2, 4 and 4 respectively. Find the mean.</p><p class=\"example\"><strong>Step 1:</strong> Calculate fx: 1×2=2; 2×4=8; 3×4=12.</p><p class=\"example\"><strong>Step 2:</strong> Σfx = 2 + 8 + 12 = 22; Σf = 2 + 4 + 4 = 10.</p><p class=\"example\"><strong>Step 3:</strong> Mean = 22/10.</p><p class=\"example\"><strong>Answer:</strong> 2.2.</p><h3>Worked Example 3: Pie chart angle</h3><p class=\"example\"><strong>Question:</strong> In a survey of 40 students, 10 choose football as their favourite sport. Find the pie-chart angle for football.</p><p class=\"example\"><strong>Step 1:</strong> Angle = (frequency/total) × 360°.</p><p class=\"example\"><strong>Step 2:</strong> = (10/40) × 360° = ¼ × 360°.</p><p class=\"example\"><strong>Answer:</strong> 90°.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the mean of 4, 6, 8 and 10.</li><li>Find the median of 3, 9, 2, 7, 5.</li><li>A category has frequency 15 out of 60. Find its pie-chart angle.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>7</td></tr><tr><td>2</td><td>5</td></tr><tr><td>3</td><td>90°</td></tr></table></section><section class=\"chapter\" id=\"ch15\"><p><b>CHAPTER 15</b></p><h2>Probability</h2><p>Probability measures how likely an event is to occur. It ranges from 0 (impossible) to 1 (certain). A probability model must identify the possible outcomes and the outcomes that satisfy the event.</p><h3>15.1 Basic probability</h3><p class=\"\">When all outcomes are equally likely, P(A) = number of outcomes favourable to A ÷ total number of possible outcomes. The complement rule is P(not A) = 1 − P(A).</p><p class=\"\">Probabilities are between 0 and 1 inclusive. The probability of the sample space is 1.</p><h3>15.2 Combined events</h3><p class=\"\">For independent events A and B, P(A and B) = P(A) × P(B). For mutually exclusive events, P(A or B) = P(A) + P(B). If events are not mutually exclusive, subtract the overlap: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).</p><h3>Worked Example 1: A fair die</h3><p class=\"example\"><strong>Question:</strong> A fair six-sided die is rolled once. Find the probability of obtaining an even number.</p><p class=\"example\"><strong>Step 1:</strong> Possible outcomes are 1, 2, 3, 4, 5, 6: six outcomes.</p><p class=\"example\"><strong>Step 2:</strong> Even outcomes are 2, 4, 6: three favourable outcomes.</p><p class=\"example\"><strong>Step 3:</strong> P(even) = 3/6.</p><p class=\"example\"><strong>Answer:</strong> 1/2.</p><h3>Worked Example 2: Complement</h3><p class=\"example\"><strong>Question:</strong> The probability that it rains tomorrow is 0.35. Find the probability that it does not rain, assuming these are the only two outcomes.</p><p class=\"example\"><strong>Step 1:</strong> P(not rain) = 1 − P(rain).</p><p class=\"example\"><strong>Step 2:</strong> = 1 − 0.35.</p><p class=\"example\"><strong>Answer:</strong> 0.65.</p><h3>Worked Example 3: Two independent coin tosses</h3><p class=\"example\"><strong>Question:</strong> A fair coin is tossed twice. Find the probability of getting two heads.</p><p class=\"example\"><strong>Step 1:</strong> Probability of head on each toss = 1/2.</p><p class=\"example\"><strong>Step 2:</strong> The tosses are independent, so multiply: 1/2 × 1/2.</p><p class=\"example\"><strong>Answer:</strong> 1/4.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>A bag contains 3 red and 5 blue balls. Find P(red) when one ball is picked at random.</li><li>Find the probability of not getting a 6 on a fair die.</li><li>A fair coin is tossed three times. Find P(three heads).</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>3/8</td></tr><tr><td>2</td><td>5/6</td></tr><tr><td>3</td><td>1/8</td></tr></table></section><section class=\"chapter\" id=\"ch16\"><p><b>CHAPTER 16</b></p><h2>Vectors and Basic Calculus</h2><p>Vectors have both magnitude and direction. Calculus studies change and accumulation. These ideas provide useful mathematical tools for describing movement, gradients and rates of change.</p><h3>16.1 Vectors</h3><p class=\"\">A scalar has magnitude only, such as mass or temperature. A vector has magnitude and direction, such as displacement or velocity. In two dimensions, a vector may be written as (a, b) or as a column vector.</p><p class=\"\">To add vectors, add corresponding components. To multiply a vector by a scalar, multiply every component by that scalar. The magnitude of (a, b) is √(a² + b²).</p><h3>16.2 Differentiation</h3><p class=\"\">Differentiation finds the rate of change of a function and the gradient of a curve. For a power term, d/dx(xⁿ) = nxⁿ⁻¹. Differentiate each term separately and remember that the derivative of a constant is zero.</p><p class=\"\">This basic power rule applies to polynomial terms; more advanced functions require additional rules.</p><h3>16.3 Integration</h3><p class=\"\">Integration reverses differentiation in many elementary cases and can represent accumulated quantity or area. The power rule is ∫xⁿ dx = xⁿ⁺¹/(n + 1) + C, for n ≠ −1. The constant C is included because differentiating a constant gives zero.</p><h3>Worked Example 1: Vector addition</h3><p class=\"example\"><strong>Question:</strong> If a = (2, 3) and b = (4, −1), find a + b and the magnitude of the result.</p><p class=\"example\"><strong>Step 1:</strong> Add components: a + b = (2 + 4, 3 − 1) = (6, 2).</p><p class=\"example\"><strong>Step 2:</strong> Magnitude = √(6² + 2²) = √(36 + 4).</p><p class=\"example\"><strong>Answer:</strong> (6, 2), with magnitude √40 = 2√10.</p><h3>Worked Example 2: Differentiation</h3><p class=\"example\"><strong>Question:</strong> Differentiate y = 4x³ − 5x² + 7x − 9.</p><p class=\"example\"><strong>Step 1:</strong> Differentiate each term: 4x³ becomes 12x²; −5x² becomes −10x; 7x becomes 7; −9 becomes 0.</p><p class=\"example\"><strong>Answer:</strong> dy/dx = 12x² − 10x + 7.</p><h3>Worked Example 3: Integration</h3><p class=\"example\"><strong>Question:</strong> Evaluate ∫(6x² + 4x − 3) dx.</p><p class=\"example\"><strong>Step 1:</strong> Integrate term by term: 6x² becomes 2x³; 4x becomes 2x²; −3 becomes −3x.</p><p class=\"example\"><strong>Step 2:</strong> Add the constant of integration.</p><p class=\"example\"><strong>Answer:</strong> 2x³ + 2x² − 3x + C.</p><h3>Chapter practice</h3><p>Try the questions before checking the answer key.</p><ol><li>Find the magnitude of vector (3, 4).</li><li>Differentiate y = 5x⁴ − 2x.</li><li>Integrate 8x³ dx.</li></ol><h3>Answer key</h3><table><tr><th>No.</th><th>Answer</th></tr><tr><td>1</td><td>5</td></tr><tr><td>2</td><td>20x³ − 2</td></tr><tr><td>3</td><td>2x⁴ + C</td></tr></table></section><h2>Formula quick reference</h2><ul><li>Percentage = (part ÷ whole) × 100%</li><li>Speed = distance ÷ time</li><li>AP nth term: Tₙ = a + (n − 1)d</li><li>AP sum: Sₙ = n/2[2a + (n − 1)d]</li><li>GP nth term: Tₙ = arⁿ⁻¹</li><li>Gradient: m = (y₂ − y₁)/(x₂ − x₁)</li><li>Quadratic formula: x = [−b ± √(b² − 4ac)]/(2a)</li><li>Circle area = πr²; circumference = 2πr</li><li>Triangle area = ½bh; rectangle area = lw</li><li>Cylinder volume = πr²h; sphere volume = 4πr³/3</li><li>sin θ = opposite/hypotenuse; cos θ = adjacent/hypotenuse; tan θ = opposite/adjacent</li><li>Mean = Σx/n; frequency mean = Σfx/Σf</li><li>P(A) = favourable outcomes ÷ total equally likely outcomes</li><li>Vector magnitude of (a,b) = √(a²+b²)</li><li>d/dx(xⁿ) = nxⁿ⁻¹; ∫xⁿdx = xⁿ⁺¹/(n+1)+C, n ≠ −1</li></ul><p><b>End of Volume 1.</b> Use the current official syllabus as your checklist for further study.</p></main><button onclick=\"window.print()\">Print / Save as PDF</button></body></html>";

function openFullMathBook(){
 document.querySelector("#app").innerHTML = `${header("FULL DIGITAL TEXTBOOK","Mathematics — Volume 1","A step-by-step book with worked calculations, exercises and answers.",`<button class="btn alt" id="getMathPdf">Download PDF</button> <button class="btn line" id="getMathHtml">Download HTML</button> <button class="btn line" id="backToLibrary">Back to library</button>`)}<div class="card" style="padding:0;overflow:hidden"><iframe title="JAMB MASTER X Mathematics textbook" srcdoc="${FULL_MATH_BOOK_HTML.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" style="display:block;width:100%;height:78vh;border:0;background:white"></iframe></div>`;

}
function downloadFullMathPDF(){
 const raw=atob(FULL_MATH_BOOK_PDF_B64), bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
 const blob=new Blob([bytes],{type:"application/pdf"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="JAMB_MASTER_X_MATHEMATICS_TEXTBOOK_VOL1.pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Mathematics PDF download started");
}
function downloadFullMathHTML(){
 const blob=new Blob([FULL_MATH_BOOK_HTML],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="JAMB_MASTER_X_MATHEMATICS_TEXTBOOK_VOL1.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Offline HTML textbook download started");
}
